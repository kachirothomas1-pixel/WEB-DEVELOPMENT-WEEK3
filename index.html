<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Page Heading Banner (Card) -->
    <header class="card">
      <h1>SpendWise</h1>
      <p>Keep track of your personal finances with ease</p>
    </header>

    <!-- Add Expense Form (Card) -->
    <section class="card">
      <h2>Add New Expense</h2>
      <form>
        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" placeholder="e.g., Groceries" required>
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount ($)</label>
          <input type="number" id="expense-amount" placeholder="e.g., 50.00" required>
        </div>

        <div class="form-group">
          <label for="expense-date">Date</label>
          <input type="date" id="expense-date" required>
        </div>

        <button type="submit">Add Expense</button>
      </form>
    </section>

    <!-- Expense Table (Card) -->
    <section class="card">
      <h2>Expense History</h2>
      <table>
        <thead>
          <tr>
            <th>Expense</th>
            <th>Amount</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Groceries</td>
            <td>$45.50</td>
            <td>2026-10-12</td>
          </tr>
          <tr>
            <td>Internet Bill</td>
            <td>$60.00</td>
            <td>2026-10-10</td>
          </tr>
          <tr>
            <td>Coffee</td>
            <td>$4.50</td>
            <td>2026-10-09</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

</body>
</html>
